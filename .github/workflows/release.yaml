name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  create-release:
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag: ${{ steps.get_tag.outputs.TAG }}
    runs-on: windows-2025
    steps:
      - run: echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        shell: bash
        id: get_tag
      - uses: softprops/action-gh-release@v3
        id: create_release
        with:
          draft: false
          prerelease: true
          name: Source Explorer ${{ github.ref_name }}
          tag_name: ${{ github.ref }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        arch: [x64]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - if: startsWith(matrix.os, 'windows')
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}
      - if: startsWith(matrix.os, 'windows')
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install meson ninja

      - if: startsWith(matrix.os, 'ubuntu')
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 13
          platform: ${{ matrix.arch }}
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo python3 -m pip install --upgrade setuptools
          sudo python3 -m pip install meson ninja
          sudo apt install libx11-dev libx11-xcb-dev libxrandr-dev libwayland-dev libcairo2-dev libegl1-mesa-dev libgbm-dev

      - if: startsWith(matrix.os, 'macos')
        run: |
          brew install meson ninja
          echo "CC=$(brew --prefix llvm@20)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm@20)/bin/clang++" >> $GITHUB_ENV

      - if: startsWith(matrix.os, 'windows')
        run: meson setup build --buildtype debugoptimized -Dprefix="$pwd\install" -Dbindir=bin -Dlibdir=bin -Dlicensedir="share\licenses" -Dcpp_args="-D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR" "-Dlak_backend=win32" "-Dcobalt_renderer=OpenGL4,Direct3D11,Direct3D12"
      - if: startsWith(matrix.os, 'ubuntu')
        run: meson setup build --buildtype debugoptimized -Dprefix="$(pwd)/install" -Dlicensedir="share/licenses" "-Dsdl2_from_source=true" "-Dlak_backend=sdl2" "-Dcobalt_renderer=OpenGL4"
      - if: startsWith(matrix.os, 'macos')
        run: meson setup build --buildtype debugoptimized -Dprefix="$(pwd)/install" -Dlicensedir="share/licenses" "-Dsdl2_from_source=true" "-Dlak_backend=sdl2" "-Dcobalt_renderer=Vulkan"
      - run: meson install -C build

      - if: startsWith(matrix.os, 'windows')
        run: |
          Compress-Archive -Path install\* -DestinationPath Source-Explorer-${{ needs.create-release.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}.zip

      - if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        run: |
          cd install
          tar cfz Source-Explorer-${{ needs.create-release.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz *
          ls

      - if: startsWith(matrix.os, 'windows')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: Source-Explorer-${{ needs.create-release.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}.zip

      - if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: install/bin/Source-Explorer-${{ needs.create-release.outputs.tag }}-${{ runner.os }}-${{ matrix.arch }}.tar.gz
